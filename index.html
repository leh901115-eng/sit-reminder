<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="久坐提醒"><meta name="theme-color" content="#1e3a5f">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<title>久坐提醒</title>
<style>
body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:#0f1e33;color:#fff;font-size:24px;padding:env(safe-area-inset-top) 24px 24px}
h1{font-size:40px;text-align:center;margin:20px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#1e3a5f;border-radius:20px;padding:20px}.card .l{font-size:20px;opacity:.7}.card .v{font-size:44px;font-weight:700;margin-top:6px}
#phase{grid-column:1/3;text-align:center}#phase .v{font-size:56px}
button{font-size:32px;padding:20px 40px;border:0;border-radius:20px;margin:10px;color:#fff;background:#2e7d32}
#resetBtn{background:#c62828}.row{text-align:center;margin:20px 0}
.set{background:#1e3a5f;border-radius:20px;padding:20px;margin-top:16px}input[type=range]{width:100%;height:40px}
input[type=checkbox]{transform:scale(2);margin-right:16px}
#alert{display:none;position:fixed;inset:0;background:#d32f2f;z-index:9;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:fl 1s infinite}
#alert.on{display:flex}#alert h2{font-size:80px;margin:0}#alert p{font-size:32px}
@keyframes fl{50%{background:#ff6f00}}#msg{text-align:center;font-size:20px;opacity:.8}
</style></head><body>
<h1>🪑 久坐提醒</h1>
<div class="grid">
<div class="card" id="phase"><div class="l">当前状态</div><div class="v" id="vPhase">未启动</div></div>
<div class="card"><div class="l">已计时</div><div class="v" id="vElapsed">--</div></div>
<div class="card"><div class="l">距上次移动</div><div class="v" id="vSince">--</div></div>
<div class="card"><div class="l">下次提醒倒计时</div><div class="v" id="vNext">--</div></div>
<div class="card"><div class="l">最近移动强度 / 阈值</div><div class="v" id="vMag">--</div></div>
</div>
<div class="row"><button id="startBtn">开始</button><button id="resetBtn">清零</button></div>
<div id="msg">屏幕常亮：未请求 ｜ 运动传感器：未授权</div>
<div class="set"><label>灵敏度：<b id="vSens"></b>（越大越灵敏）<input type="range" id="sens" min="1" max="10" step="1"></label></div>
<div class="set"><label><input type="checkbox" id="testMode">测试模式（30 分钟→30 秒，5 分钟→5 秒）</label></div>
<div id="alert"><h2>该起来活动啦！</h2><p id="alertInfo"></p><button id="ackBtn" style="background:#fff;color:#c62828">清零（我已起身）</button><p style="font-size:22px">关闭此提示不会清零；不清零每 5 分钟再提醒</p><button id="hideBtn" style="background:#0006">暂时关闭提示</button></div>
<script src="logic.js"></script><script src="app.js"></script>
</body></html>
